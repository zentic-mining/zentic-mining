<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Zentic Mining</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

  html,
  body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;

  background-color: #0b1020;
  background-image: url("/mining-background.png");
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  background-attachment: fixed;

  color: #ffffff;
}

    body {
      padding: 16px;
      padding-bottom: 78px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    /* =========================
       TOP
    ========================= */

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand {
      text-align: left;
    }

    .brand-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      margin-top: 4px;
      color: #f5b83d;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .balance-box {
      text-align: right;
      padding-top: 2px;
    }

    .balance {
      font-size: 17px;
      line-height: 1.1;
      font-weight: 800;
      white-space: nowrap;
    }

    .balance-rate {
      margin-top: 4px;
      color: #c7cbd6;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* =========================
       PAGE SYSTEM
    ========================= */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* =========================
       WAREHOUSE
    ========================= */

    .section-title {
      margin: 8px 0 14px;
      text-align: left;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .equipment-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .equipment-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      background: rgba(20, 27, 46, 0.94);
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35),
        inset 0 0 18px rgba(255, 255, 255, 0.025);
    }

    .axe-image {
      width: 100%;
      aspect-ratio: 1 / 0.86;
      display: block;
      object-fit: cover;
      background: #111827;
    }

    .card-content {
      padding: 10px;
    }

    .axe-name {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.2;
    }

    .rarity {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 7px;
      border-radius: 999px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .rarity-common {
      color: #8ff0a4;
      background: rgba(50, 180, 90, 0.16);
      border: 1px solid rgba(100, 230, 130, 0.35);
    }

    .rarity-uncommon {
      color: #59d8ff;
      background: rgba(30, 160, 230, 0.15);
      border: 1px solid rgba(60, 200, 255, 0.35);
    }

    .rarity-epic {
      color: #dc82ff;
      background: rgba(160, 60, 255, 0.15);
      border: 1px solid rgba(200, 100, 255, 0.35);
    }

    .durability-label {
      margin-top: 10px;
      color: #aeb5c5;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .durability-value {
      margin-top: 3px;
      font-size: 13px;
      font-weight: 800;
    }

    .status {
      margin-top: 8px;
      padding: 6px 4px;
      text-align: center;
      border-radius: 9px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    .status-ready {
      color: #42ee8b;
      background: rgba(40, 210, 110, 0.1);
      border: 1px solid rgba(60, 240, 130, 0.22);
    }

    .status-active {
      color: #59d8ff;
      background: rgba(40, 180, 255, 0.1);
      border: 1px solid rgba(70, 200, 255, 0.22);
    }

    .status-expired {
      color: #ff7373;
      background: rgba(255, 70, 70, 0.08);
      border: 1px solid rgba(255, 90, 90, 0.2);
    }

    .start-button {
      width: 100%;
      margin-top: 8px;
      padding: 9px 4px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(
        135deg,
        #19aef5,
        #2374ff
      );
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
    }

    .start-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty-state {
      padding: 35px 20px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      color: #8e96a8;
      font-size: 13px;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      min-height: 22px;
      margin-top: 18px;
      color: #c8cedb;
      font-size: 12px;
      text-align: center;
    }

    /* =========================
       TON CONNECT
    ========================= */

    #ton-connect {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    /* =========================
       WORKSHOP
    ========================= */

    .workshop-title {
  margin: 8px 0 14px;
  text-align: left;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.workshop-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.workshop-item {
  min-width: 0;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 18px;
  background: rgba(20, 27, 46, 0.94);
  box-shadow:
    0 8px 25px rgba(0, 0, 0, 0.35),
    inset 0 0 18px rgba(255, 255, 255, 0.025);
}

.workshop-image {
  width: 100%;
  aspect-ratio: 1 / 0.86;
  display: block;
  object-fit: cover;
  background: #111827;
}

.workshop-content {
  padding: 10px;
}

.workshop-name {
  margin: 0;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.2;
}

.workshop-rarity {
  display: inline-block;
  margin-top: 5px;
  padding: 4px 7px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.workshop-price {
  margin-top: 10px;
  color: #ffffff;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.3;
}

.workshop-durability {
  margin-top: 4px;
  color: #aeb5c5;
  font-size: 8px;
  font-weight: 700;
}

.workshop-buy {
  width: 100%;
  margin-top: 9px;
  padding: 9px 4px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(
    135deg,
    #19aef5,
    #2374ff
  );
  color: #ffffff;
  font-size: 9px;
  font-weight: 800;
  cursor: pointer;
}

.workshop-buy:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

@media (max-width: 390px) {
  .workshop-grid {
    gap: 8px;
  }

  .workshop-content {
    padding: 8px;
  }

  .workshop-name {
    font-size: 12px;
  }

  .workshop-price {
    font-size: 10px;
  }

  .workshop-rarity {
    font-size: 7px;
  }

  .workshop-buy {
    font-size: 8px;
  }
}


    /* =========================
       REWARDS
    ========================= */

    .rewards-title {
      margin: 8px 0 14px;
      text-align: left;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .rewards-card {
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      background: rgba(20, 27, 46, 0.94);
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35),
        inset 0 0 18px rgba(255, 255, 255, 0.025);
    }

    .rewards-card h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    .rewards-card p {
      margin: 8px 0 0;
      color: #aeb5c5;
      font-size: 11px;
      line-height: 1.5;
    }

    /* =========================
       BOTTOM NAVIGATION
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);

      width: min(520px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      padding: 8px 10px;
      background: rgba(11, 16, 32, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.10);

      z-index: 1000;
    }

    .nav-button {
      border: 0;
      background: transparent;
      color: #8e96a8;

      padding: 10px 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;

      cursor: pointer;
    }

    .nav-button.active {
      color: #ffffff;
    }

    .nav-button:active {
      opacity: 0.7;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 390px) {
      body {
        padding: 12px;
        padding-bottom: 78px;
      }

      .brand-title {
        font-size: 21px;
      }

      .balance {
        font-size: 15px;
      }

      .equipment-grid {
        gap: 8px;
      }

      .card-content {
        padding: 8px;
      }

      .axe-name {
        font-size: 12px;
      }

      .rarity {
        font-size: 7px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TOP -->
    <div class="topbar">

      <div class="brand">
        <h1 class="brand-title">
          Zentic Mining
        </h1>

        <div class="brand-subtitle">
          MINING FUTURE
        </div>
      </div>

      <div class="balance-box">

        <div
          class="balance"
          id="zenticBalance"
        >
          Loading...
        </div>

        <div class="balance-rate">
          1M Zentic = 1 USDT
        </div>

      </div>

    </div>


    <!-- =========================
         WAREHOUSE
    ========================= -->

    <div
      id="warehousePage"
      class="page active"
    >

      <div class="section-title">
        WAREHOUSE
      </div>

      <div
        id="equipmentGrid"
        class="equipment-grid"
      ></div>

    </div>

    <div id="status"></div>


    <!-- WORKSHOP -->
<div
  id="workshopPage"
  class="page"
>
  <div class="workshop-title">
    WORKSHOP
  </div>

  <div class="workshop-grid">

    <div class="workshop-item">
      <img
        class="workshop-image"
        src="/stone-axe.png"
        alt="Stone Axe"
      />

      <div class="workshop-content">

        <h2 class="workshop-name">
          Stone Axe
        </h2>

        <div class="workshop-rarity rarity-common">
          Common
        </div>

        <div class="workshop-price">
          50,000 Zentic
        </div>

        <div class="workshop-durability">
          20 DAYS
        </div>

        <button
          class="workshop-buy"
          type="button"
          onclick="buyStoneAxe(this)"
        >
          BUY
        </button>

      </div>
    </div>


    <div class="workshop-item">
      <img
        class="workshop-image"
        src="/iron-axe.png"
        alt="Iron Axe"
      />

      <div class="workshop-content">

        <h2 class="workshop-name">
          Iron Axe
        </h2>

        <div class="workshop-rarity rarity-uncommon">
          Uncommon
        </div>

        <div class="workshop-price">
          100 Telegram Stars
        </div>

        <div class="workshop-durability">
          30 DAYS
        </div>

        <button
          class="workshop-buy"
          type="button"
          onclick="buyStarsAxe('iron_axe', this)"
        >
          BUY
        </button>

      </div>
    </div>


    <div class="workshop-item">
      <img
        class="workshop-image"
        src="/steel-axe.png"
        alt="Steel Axe"
      />

      <div class="workshop-content">

        <h2 class="workshop-name">
          Steel Axe
        </h2>

        <div class="workshop-rarity rarity-epic">
          Epic
        </div>

        <div class="workshop-price">
          500 Telegram Stars
        </div>

        <div class="workshop-durability">
          45 DAYS
        </div>

        <button
          class="workshop-buy"
          type="button"
          onclick="buyStarsAxe('steel_axe', this)"
        >
          BUY
        </button>

      </div>
    </div>

  </div>
</div>


    <!-- =========================
         REWARDS
    ========================= -->

    <div
      id="rewardsPage"
      class="page"
    >

      <div class="rewards-title">
        REWARDS
      </div>

      <div class="rewards-card">

        <h2>
          Mining Rewards
        </h2>

        <p>
          Rewards and achievements will appear here.
        </p>

      </div>

    </div>


    <!-- TON CONNECT -->
    <div id="ton-connect"></div>

  </div>


  <!-- =========================
       BOTTOM NAVIGATION
  ========================= -->

  <nav class="bottom-nav">

    <button
      class="nav-button active"
      onclick="switchPage('warehouse', this)"
    >
      WAREHOUSE
    </button>

    <button
      class="nav-button"
      onclick="switchPage('workshop', this)"
    >
      WORKSHOP
    </button>

    <button
      class="nav-button"
      onclick="switchPage('rewards', this)"
    >
      REWARDS
    </button>

  </nav>


  <script>
    const tg = window.Telegram.WebApp;

    const DAY_MS =
      24 * 60 * 60 * 1000;


    const EQUIPMENT = {

      stone_axe: {
        name: "Stone Axe",
        rarity: "Common",
        rarityClass: "rarity-common",
        maxDurability: 20,
        image: "/stone-axe.png"
      },

      iron_axe: {
        name: "Iron Axe",
        rarity: "Uncommon",
        rarityClass: "rarity-uncommon",
        maxDurability: 30,
        image: "/iron-axe.png"
      },

      steel_axe: {
        name: "Steel Axe",
        rarity: "Epic",
        rarityClass: "rarity-epic",
        maxDurability: 45,
        image: "/steel-axe.png"
      }

    };


    /* =========================
       TELEGRAM
    ========================= */

    tg.ready();
    tg.expand();


    /* =========================
       TON CONNECT
    ========================= */

    const tonConnectUI =
      new TON_CONNECT_UI.TonConnectUI({
        manifestUrl:
          "https://zentic-mining.vercel.app/tonconnect-manifest.json",

        buttonRootId:
          "ton-connect"
      });


    tonConnectUI.setConnectRequestParameters({
      state: "loading"
    });


    fetch("/api/wallet", {
      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({
        initData: tg.initData,
        action: "generate-proof"
      })

    })

      .then((response) =>
        response.json()
      )

      .then((data) => {

        if (
          !data.success ||
          !data.tonProofPayload
        ) {

          throw new Error(
            data.error ||
            "Failed to generate TON proof"
          );

        }


        tonConnectUI.setConnectRequestParameters({
          state: "ready",

          value: {
            tonProof:
              data.tonProofPayload
          }
        });

      })

      .catch(() => {

        tonConnectUI.setConnectRequestParameters(
          null
        );

      });


    tonConnectUI.onStatusChange(
      (wallet) => {

        if (!wallet) {
          return;
        }


        const tonProof =
          wallet.connectItems?.tonProof;


        if (
          tonProof &&
          "proof" in tonProof
        ) {

          fetch("/api/wallet", {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              initData:
                tg.initData,

              action:
                "verify-proof",

              proof: {

                address:
                  wallet.account.address,

                network:
                  wallet.account.chain,

                publicKey:
                  wallet.account.publicKey,

                walletStateInit:
                  wallet.account
                    .walletStateInit,

                ...tonProof.proof

              }

            })

          }).catch(() => {});

        }

      }
    );


    /* =========================
       PAGE SWITCHING
    ========================= */

    function switchPage(
      pageName,
      button
    ) {

      const pages =
        document.querySelectorAll(
          ".page"
        );


      pages.forEach((page) => {
        page.classList.remove(
          "active"
        );
      });


      const target =
        document.getElementById(
          pageName + "Page"
        );


      if (target) {

        target.classList.add(
          "active"
        );

      }


      const buttons =
        document.querySelectorAll(
          ".nav-button"
        );


      buttons.forEach((navButton) => {

        navButton.classList.remove(
          "active"
        );

      });


      if (button) {

        button.classList.add(
          "active"
        );

      }

    }


    /* =========================
       HELPERS
    ========================= */

    function formatBalance(value) {

      const number =
        Number(value || 0);


      return number.toLocaleString(
        "en-US"
      );

    }


    function getEquipmentInfo(item) {

      return EQUIPMENT[item] || {

        name: item,

        rarity: "Common",

        rarityClass:
          "rarity-common",

        maxDurability: 0,

        image: ""

      };

    }


    function getDurability(item) {

      const info =
        getEquipmentInfo(
          item.item
        );


      if (
        item.status === "ready"
      ) {

        return info.maxDurability;

      }


      if (
        item.status === "expired" ||
        !item.expires_at
      ) {

        return 0;

      }


      const expires =
        new Date(
          item.expires_at
        ).getTime();


      const remaining =
        Math.max(
          0,
          expires - Date.now()
        );


      return Math.min(

        info.maxDurability,

        Math.ceil(
          remaining / DAY_MS
        )

      );

    }


    function getStatus(item) {

      if (
        item.status === "ready"
      ) {

        return "READY";

      }


      if (
        item.status === "active"
      ) {

        const expires =
          item.expires_at
            ? new Date(
                item.expires_at
              ).getTime()
            : 0;


        if (
          expires > 0 &&
          expires <= Date.now()
        ) {

          return "EXPIRED";

        }


        return "ACTIVE";

      }


      return "EXPIRED";

    }


    function renderEquipment(
      inventory
    ) {

      const grid =
        document.getElementById(
          "equipmentGrid"
        );


      grid.innerHTML = "";


      if (
        !Array.isArray(inventory) ||
        inventory.length === 0
      ) {

        grid.innerHTML = `

          <div class="empty-state">
            No mining equipment available.
          </div>

        `;

        return;

      }


      const sorted =
        [...inventory].sort(
          (a, b) => {

            const order = {

              stone_axe: 1,

              iron_axe: 2,

              steel_axe: 3

            };


            return (

              (order[a.item] || 99) -

              (order[b.item] || 99)

            );

          }
        );


      sorted.forEach((item) => {

        const info =
          getEquipmentInfo(
            item.item
          );


        const durability =
          getDurability(item);


        const status =
          getStatus(item);


        const statusClass =
          status === "READY"

            ? "status-ready"

            : status === "ACTIVE"

              ? "status-active"

              : "status-expired";


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "equipment-card";


        card.innerHTML = `

          <img
            class="axe-image"
            src="${info.image}"
            alt="${info.name}"
          />

          <div class="card-content">

            <h2 class="axe-name">
              ${info.name}
            </h2>


            <div
              class="rarity ${info.rarityClass}"
            >
              ${info.rarity}
            </div>


            <div class="durability-label">
              DURABILITY
            </div>


            <div class="durability-value">
              ${durability} / ${info.maxDurability}
            </div>


            <div
              class="status ${statusClass}"
            >
              ${status}
            </div>


            ${
              status === "READY"

                ? `

                  <button
                    class="start-button"
                    onclick="startMining(
                      '${item.id}',
                      this
                    )"
                  >
                    START MINING
                  </button>

                `

                : ""

            }

          </div>

        `;


        grid.appendChild(card);

      });

    }


    /* =========================
       LOAD PLAYER
    ========================= */

    async function loadPlayer() {

      const balanceElement =
        document.getElementById(
          "zenticBalance"
        );


      balanceElement.textContent =
        "Loading...";


      try {

        const response =
          await fetch(
            "/api/player",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                initData:
                  tg.initData
              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Failed to load player"
          );

        }


        const balance =
          Number(
            data.user?.zentic_balance ||
            0
          );


        balanceElement.textContent =
          formatBalance(
            balance
          )

              renderEquipment(
          data.inventory || []
        );

      } catch (error) {

        balanceElement.textContent =
          "Unable to load";

        document.getElementById(
          "equipmentGrid"
        ).innerHTML = `
          <div class="empty-state">
            Failed to load warehouse.
          </div>
        `;

        document.getElementById(
          "status"
        ).textContent =
          error.message;
      }
    }

    /* BUY STONE AXE */
async function buyStoneAxe(button) {
  if (!button) {
    return;
  }

  button.disabled = true;

  const status =
    document.getElementById("status");

  status.textContent =
    "Purchasing Stone Axe...";

  try {
    const response =
      await fetch(
        "/api/buy-axe",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            initData: tg.initData,
            item: "stone_axe"
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Failed to buy Stone Axe"
      );
    }

    status.textContent =
      "Stone Axe purchased successfully!";

    await loadPlayer();

  } catch (error) {
    status.textContent =
      "Buy Failed: " +
      error.message;
  } finally {
    button.disabled = false;
  }
}

    /* BUY AXE WITH TELEGRAM STARS */
async function buyStarsAxe(item, button) {
  if (!item || !button) {
    return;
  }

  button.disabled = true;

  const status =
    document.getElementById("status");

  status.textContent =
    "Creating Telegram Stars invoice...";

  try {
    const response =
      await fetch(
        "/api/create-invoice",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            item: item
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Failed to create invoice"
      );
    }

    if (!data.invoice_url) {
      throw new Error(
        "Invoice URL is missing"
      );
    }

    tg.openInvoice(
      data.invoice_url,
      async (result) => {

        if (result === "paid") {

          status.textContent =
            "Payment successful!";

          await new Promise(
            (resolve) =>
              setTimeout(resolve, 1000)
          );

          await loadPlayer();

        } else if (result === "cancelled") {

          status.textContent =
            "Payment cancelled.";

        } else if (result === "failed") {

          status.textContent =
            "Payment failed.";

        } else if (result === "pending") {

          status.textContent =
            "Payment pending.";

        } else {

          status.textContent =
            "Payment status: " +
            result;
        }

        button.disabled = false;
      }
    );

  } catch (error) {

    status.textContent =
      "Buy Failed: " +
      error.message;

    button.disabled = false;
  }
}
