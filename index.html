<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zentic Mining</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #ffffff;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .balance-card {
      background: #1f2937;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .balance-label {
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
    }

    .card {
      background: #1f2937;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin-top: 0;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 12px 0 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #f59e0b;
      color: #111827;
      margin-top: 8px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      min-height: 24px;
      color: #d1d5db;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Zentic Mining</h1>

    <div class="balance-card">
      <div class="balance-label">Zentic Balance</div>
      <div class="balance" id="zenticBalance">
        Loading...
      </div>
    </div>

    <div class="subtitle">
      Upgrade your mining equipment
    </div>
    
<div id="ton-connect"></div>
    
    <div class="card">
      <h2>Stone Axe</h2>

      <div class="price">
        50,000 Zentic
      </div>

      <button onclick="buyItem('stone_axe', this)">
        BUY STONE AXE
      </button>

      <button
        id="startMiningButton"
        onclick="startMining()"
      >
        START MINING
      </button>
    </div>

    <div class="card">
      <h2>Iron Axe</h2>

      <div class="price">
        100 Stars
      </div>

      <button onclick="buyItem('iron_axe', this)">
        Buy Iron Axe
      </button>
    </div>

    <div class="card">
      <h2>Steel Axe</h2>

      <div class="price">
        500 Stars
      </div>

      <button onclick="buyItem('steel_axe', this)">
        Buy Steel Axe
      </button>
    </div>

    <button onclick="testMining()">
      Test Mining
    </button>

    <button onclick="testRewardAd()">
      TEST REWARDED AD
    </button>

    <div id="status"></div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const AdController = window.Adsgram.init({
      blockId: "49221",
      debug: true,
      debugBannerType: "RewardedVideo"
    });

    async function loadPlayer() {
      const balanceElement =
        document.getElementById("zenticBalance");

      balanceElement.textContent = "Loading...";

      try {
        const response = await fetch("/api/player", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            initData: tg.initData
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Failed to load player"
          );
        }

        const balance =
          Number(data.user?.zentic_balance || 0);

        balanceElement.textContent =
          balance.toLocaleString("en-US") + " Zentic";

        console.log("Player Result:", data);

        return data;

      } catch (error) {
        console.error("Load Player Error:", error);

        balanceElement.textContent =
          "Unable to load";

        document.getElementById("status").textContent =
          "Failed to load player: " +
          error.message;

        return null;
      }
    }

    async function testRewardAd() {
  const status =
    document.getElementById("status");

  status.textContent =
    "Loading rewarded ad...";

  try {
    const result =
      await AdController.show();

    console.log(
      "AdsGram Result:",
      result
    );

    // AdsGram rewarded ad selesai.
    // Sekarang laporkan completion ke backend.
    const response =
      await fetch("/api/daily-boost", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          initData: tg.initData
        })
      });

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Failed to update Daily Boost"
      );
    }

    console.log(
      "Daily Boost Result:",
      data
    );

    if (data.ads_completed >= 3) {
      status.textContent =
        "⚡ Daily Boost active for 1 hour!";
    } else {
      status.textContent =
        "Rewarded ad completed! " +
        data.ads_completed +
        "/3";
    }

  } catch (error) {
    console.error(
      "AdsGram / Daily Boost Error:",
      error
    );

    status.textContent =
      "Ad failed or closed.";
  }
}

    async function testTelegramAuth() {
      const status =
        document.getElementById("status");

      status.textContent =
        "Checking Telegram authentication...";

      try {
        const response = await fetch(
          "/api/test-telegram-auth",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              initData: tg.initData
            })
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Telegram authentication failed"
          );
        }

        status.textContent =
          "Telegram Auth OK. User ID: " +
          data.telegram_user_id;

        console.log(
          "Telegram Auth Result:",
          data
        );

      } catch (error) {
        console.error(error);

        status.textContent =
          "Telegram Auth Failed: " +
          error.message;
      }
    }

    async function buyItem(item, button) {
      const status =
        document.getElementById("status");

      button.disabled = true;

      status.textContent =
        "Buying Stone Axe...";

      try {
        const response = await fetch(
          "/api/buy-axe",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              initData: tg.initData,
              item: item
            })
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Failed to buy Axe"
          );
        }

        status.textContent =
          "🪓 Stone Axe purchased successfully!";

        console.log(
          "Buy Axe Result:",
          data
        );

        // Refresh balance after successful purchase.
        await loadPlayer();

      } catch (error) {
        console.error(error);

        status.textContent =
          "Purchase Failed: " +
          error.message;

      } finally {
        button.disabled = false;
      }
    }

    async function startMining() {
      const status =
        document.getElementById("status");

      const button =
        document.getElementById(
          "startMiningButton"
        );

      button.disabled = true;

      status.textContent =
        "Starting mining...";

      try {
        // Get latest player inventory
        const playerResponse =
          await fetch("/api/player", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              initData: tg.initData
            })
          });

        const playerData =
          await playerResponse.json();

        if (!playerResponse.ok) {
          throw new Error(
            playerData.error ||
            "Failed to load player"
          );
        }

        // Refresh displayed balance
        const balance =
          Number(
            playerData.user?.zentic_balance || 0
          );

        document.getElementById(
          "zenticBalance"
        ).textContent =
          balance.toLocaleString("en-US") +
          " Zentic";

        const stoneAxe =
          playerData.inventory.find(
            (item) =>
              item.item === "stone_axe" &&
              item.status === "ready"
          );

        if (!stoneAxe) {
          throw new Error(
            "No Stone Axe ready to start mining"
          );
        }

        // Start mining
        const response =
          await fetch("/api/claim-axe", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              initData: tg.initData,
              inventory_id: stoneAxe.id
            })
          });

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Failed to start mining"
          );
        }

        status.textContent =
          "⛏️ Mining started successfully!";

        console.log(
          "Start Mining Result:",
          data
        );

      } catch (error) {
        console.error(error);

        status.textContent =
          "Start Mining Failed: " +
          error.message;

        button.disabled = false;
      }
    }

    async function testMining() {
      const status =
        document.getElementById("status");

      status.textContent =
        "Mining...";

      try {
        const response =
          await fetch("/api/mine", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              initData: tg.initData
            })
          });

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Mining failed"
          );
        }

        status.textContent =
          "Mining OK. Earned: " +
          data.earned_zentic +
          " Zentic";

        console.log(
          "Mining Result:",
          data
        );

        // Refresh balance after mining.
        await loadPlayer();

      } catch (error) {
        console.error(error);

        status.textContent =
          "Mining Failed: " +
          error.message;
      }
    }

    // Load player and balance when the app opens.
    loadPlayer();
  </script>
</body>
  </html>
